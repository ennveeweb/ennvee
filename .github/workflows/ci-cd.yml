name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update cPanel repository
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          REPOSITORY_PATH: /home/ennvee1/repositories/ennvee

        run: |
          set -e

          echo "Updating cPanel Git repository..."

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${REPOSITORY_PATH}" \
            --data-urlencode "branch=main" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update")

          echo "cPanel Update Response:"
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status')

          if [ "$STATUS" != "1" ]; then
            echo "ERROR: cPanel repository update failed."
            exit 1
          fi

          echo "cPanel repository update completed successfully."

      - name: Deploy cPanel repository
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          REPOSITORY_PATH: /home/ennvee1/repositories/ennvee

        run: |
          set -e

          echo "Deploying cPanel repository..."

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${REPOSITORY_PATH}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create")

          echo "cPanel Deployment Response:"
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status')

          if [ "$STATUS" != "1" ]; then
            echo "ERROR: cPanel deployment failed."
            exit 1
          fi

          echo "cPanel deployment completed successfully."
